apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgres
  namespace: argo
  annotations:
    argocd-diff-preview/watch-pattern: |
      argo/charts/data/postgres/templates/.*,
      argo/charts/data/postgres/values.*\.ya?ml,
      argo/charts/data/postgres/Chart\.yaml,
      argo/charts/data/postgres/Chart\.lock
spec:
  project: data
  destination:
    server: https://kubernetes.default.svc
    namespace: postgres
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  source:
    repoURL: git@github.com:Sean-FC/playground.git
    targetRevision: main
    path: argo/charts/data/postgres
    helm:
      valueFiles:
        - values.dev.yaml
