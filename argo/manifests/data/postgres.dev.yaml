apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgres
  namespace: argo
spec:
  project: data
  destination:
    server: https://kubernetes.default.svc
    namespace: postgres
  syncPolicy:
    automated: {}
    syncOptions:
      - CreateNamespace=true
  source:
    repoURL: git@github.com:Sean-FC/playground.git
    targetRevision: main
    path: argo/charts/data/postgres
    helm:
      valueFiles:
        - values.dev.yaml
