apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: spark
  namespace: argo
spec:
  project: data
  destination:
    server: https://kubernetes.default.svc
    namespace: spark
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
  source:
    repoURL: git@github.com:Sean-FC/playground.git
    targetRevision: main
    path: argo/charts/data/spark
    helm:
      valueFiles:
        - values.dev.yaml
