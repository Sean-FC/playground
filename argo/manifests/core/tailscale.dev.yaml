apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tailscale
  namespace: argo
  annotations:
    argocd-diff-preview/watch-pattern: |
      argo/charts/core/tailscale/templates/.*,
      argo/charts/core/tailscale/values.*\.ya?ml,
      argo/charts/core/tailscale/Chart\.yaml,
      argo/charts/core/tailscale/Chart\.lock
spec:
  project: core
  destination:
    server: https://kubernetes.default.svc
    namespace: tailscale
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
  source:
    repoURL: git@github.com:Sean-FC/playground.git
    targetRevision: main
    path: argo/charts/core/tailscale
    helm:
      valueFiles:
        - values.dev.yaml
