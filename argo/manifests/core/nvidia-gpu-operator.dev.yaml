apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nvidia-gpu-operator
  namespace: argo
  annotations:
    argocd-diff-preview/watch-pattern: |
      argo/charts/core/nvidia-gpu-operator/templates/.*,
      argo/charts/core/nvidia-gpu-operator/values.*\.ya?ml,
      argo/charts/core/nvidia-gpu-operator/Chart\.yaml,
      argo/charts/core/nvidia-gpu-operator/Chart\.lock
spec:
  project: core
  destination:
    server: https://kubernetes.default.svc
    namespace: nvidia-gpu-operator
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  source:
    repoURL: git@github.com:Sean-FC/playground.git
    targetRevision: main
    path: argo/charts/core/nvidia-gpu-operator
    helm:
      valueFiles:
        - values.yaml
