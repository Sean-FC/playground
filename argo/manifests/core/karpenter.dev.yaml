apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: karpenter
  namespace: argo
  annotations:
    argocd-diff-preview/watch-pattern: |
      argo/charts/core/karpenter/templates/.*,
      argo/charts/core/karpenter/values.*\.ya?ml,
      argo/charts/core/karpenter/Chart\.yaml,
      argo/charts/core/karpenter/Chart\.lock
spec:
  project: core
  destination:
    server: https://kubernetes.default.svc
    namespace: karpenter
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  source:
    repoURL: git@github.com:Sean-FC/playground.git
    targetRevision: main
    path: argo/charts/core/karpenter
    helm:
      valueFiles:
        - values.dev.yaml
