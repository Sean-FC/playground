apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: renovate
  namespace: argo
spec:
  project: core
  destination:
    server: https://kubernetes.default.svc
    namespace: renovate
  syncPolicy:
    automated: {}
    syncOptions:
      - CreateNamespace=true
    managedNamespaceMetadata:
      labels:
        terminable: "true"
  source:
    repoURL: git@github.com:Sean-FC/playground.git
    targetRevision: main
    path: argo/charts/core/renovate
    helm:
      valueFiles:
        - values.dev.yaml
