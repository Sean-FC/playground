apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gha
  namespace: argo
spec:
  project: core
  destination:
    server: https://kubernetes.default.svc
    namespace: gha
    annotations:
      argocd-diff-preview/watch-pattern: |
        argo/charts/core/gha/templates/.*,
        argo/charts/core/gha/values.*\.ya?ml,
        argo/charts/core/gha/Chart\.yaml,
        argo/charts/core/gha/Chart\.lock
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
      - ServerSideApply=true
  source:
    repoURL: git@github.com:Sean-FC/playground.git
    targetRevision: main
    path: argo/charts/core/gha
    helm:
      skipCrds: false
      valueFiles:
        - values.dev.yaml
