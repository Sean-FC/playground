apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: irsa
  namespace: argo
  annotations:
    argocd-diff-preview/watch-pattern: |
      argo/charts/core/amazon-eks-pod-identity-webhook/templates/.*,
      argo/charts/core/amazon-eks-pod-identity-webhook/values.*\.ya?ml,
      argo/charts/core/amazon-eks-pod-identity-webhook/Chart\.yaml,
      argo/charts/core/amazon-eks-pod-identity-webhook/Chart\.lock
spec:
  project: core
  destination:
    server: https://kubernetes.default.svc
    namespace: irsa
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  source:
    repoURL: git@github.com:Sean-FC/playground.git
    targetRevision: main
    path: argo/charts/core/amazon-eks-pod-identity-webhook
    helm:
      valueFiles:
        - values.yaml
