apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argo
  annotations:
    argocd-diff-preview/watch-pattern: |
      argo/charts/core/traefik/templates/.*,
      argo/charts/core/traefik/values.*\.ya?ml,
      argo/charts/core/traefik/Chart\.yaml,
      argo/charts/core/traefik/Chart\.lock
spec:
  project: core
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  source:
    repoURL: git@github.com:Sean-FC/playground.git
    targetRevision: main
    path: argo/charts/core/traefik
    helm:
      skipCrds: true
      valueFiles:
        - values.dev.yaml
        - values.crowdsec.yaml
