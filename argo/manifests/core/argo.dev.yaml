apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo
  namespace: argo
  annotations:
    argocd-diff-preview/watch-pattern: |
      argo/charts/core/argo/templates/.*,
      argo/charts/core/argo/values.*\.ya?ml,
      argo/charts/core/argo/Chart\.yaml,
      argo/charts/core/argo/Chart\.lock
spec:
  project: core
  destination:
    server: https://kubernetes.default.svc
    namespace: argo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
  source:
    repoURL: git@github.com:Sean-FC/playground.git
    targetRevision: main
    path: argo/charts/core/argo
    helm:
      valueFiles:
        - values.dev.yaml
