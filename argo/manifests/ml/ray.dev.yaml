apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ray
  namespace: argo
  annotations:
    argocd-diff-preview/watch-pattern: |
      argo/charts/ml/ray/templates/.*,
      argo/charts/ml/ray/values.*\.ya?ml,
      argo/charts/ml/ray/Chart\.yaml,
      argo/charts/ml/ray/Chart\.lock
spec:
  project: ml
  destination:
    server: https://kubernetes.default.svc
    namespace: ray
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  source:
    repoURL: git@github.com:Sean-FC/playground.git
    targetRevision: main
    path: argo/charts/ml/ray
    helm:
      skipCrds: true
      valueFiles:
        - values.dev.yaml
