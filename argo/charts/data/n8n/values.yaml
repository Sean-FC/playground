n8n:
  fullnameOverride: n8n
  strategy:
    type: Recreate
  db:
    type: postgresdb
  externalPostgresql:
    host: postgres.postgres.svc.cluster.local
    username: platform
    existingSecret: postgres-platform
  # Workaround: uses this key to choose the 'password' field in existingSecret
  postgresql:
    auth:
      username: platform
  existingEncryptionKeySecret: n8n-secrets
  versionNotifications:
    enabled: true
  podAnnotations:
    reloader.stakater.com/auto: "true"
  main:
    pdb:
      enabled: false
    initContainers:
      - name: init-postgres
        image: postgres:18-alpine
        imagePullPolicy: IfNotPresent
        env:
          - name: PGHOST
            value: postgres.postgres.svc.cluster.local
          - name: PGPORT
            value: "5432"
          - name: PGUSER
            valueFrom:
              secretKeyRef:
                name: postgres-platform
                key: username
          - name: PGPASSWORD
            valueFrom:
              secretKeyRef:
                name: postgres-platform
                key: password
        command:
          - /bin/sh
          - -ec
          - |
            until pg_isready --host "$PGHOST" --port "$PGPORT" --username "$PGUSER"; do
              sleep 5
            done

            psql --dbname postgres --set=ON_ERROR_STOP=1 <<'SQL'
            SELECT 'CREATE DATABASE n8n'
            WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = 'n8n') \gexec
            SQL
    livenessProbe:
      initialDelaySeconds: 60
      periodSeconds: 20
      timeoutSeconds: 5
      failureThreshold: 6
    readinessProbe:
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 6
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: node-role.kubernetes.io/control-plane
                  operator: DoesNotExist
  nodeSelector:
    kubernetes.io/os: linux
    karpenter.sh/capacity-type: spot
