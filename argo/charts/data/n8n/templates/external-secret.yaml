{{- if .Values.externalSecret.enabled -}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ required "n8n.existingEncryptionKeySecret must be set when externalSecret.enabled=true" .Values.n8n.existingEncryptionKeySecret }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  secretStoreRef:
    name: parameterstore
    kind: ClusterSecretStore
  refreshInterval: 24h
  target:
    name: {{ .Values.n8n.existingEncryptionKeySecret }}
    creationPolicy: Owner
  data:
    - secretKey: N8N_ENCRYPTION_KEY
      remoteRef:
        key: {{ $.Values.externalSecret.remoteRef.key | quote }}
        property: "encryption-key"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: N8N_INSTANCE_OWNER_EMAIL
      remoteRef:
        key: {{ $.Values.externalSecret.remoteRef.key | quote }}
        property: "owner-email"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: N8N_INSTANCE_OWNER_PASSWORD_HASH
      remoteRef:
        key: {{ $.Values.externalSecret.remoteRef.key | quote }}
        property: "owner-password-hash"
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
{{- end }}
