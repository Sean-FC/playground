{{- if .Values.httpRoute.enabled -}}
{{- $n8nValues := .Values.n8n -}}
{{- $n8nName := default "n8n" $n8nValues.nameOverride -}}
{{- $serviceName := default (printf "%s-%s" .Release.Name $n8nName) $n8nValues.fullnameOverride | trunc 63 | trimSuffix "-" -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Values.httpRoute.name }}
spec:
  parentRefs:
    {{- toYaml .Values.httpRoute.parentRefs | nindent 4 }}
  hostnames:
    {{- toYaml .Values.httpRoute.hostnames | nindent 4 }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ $serviceName }}
          port: {{ default 5678 $n8nValues.service.port }}
          weight: 1
{{- end }}
