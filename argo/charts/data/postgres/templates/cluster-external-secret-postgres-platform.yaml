{{- $serviceName := default .Release.Name .Values.postgres.fullnameOverride }}
{{- $remoteRefKey := .Values.postgresExternalSecret.remoteRef.key }}
{{- if $remoteRefKey }}
apiVersion: external-secrets.io/v1
kind: ClusterExternalSecret
metadata:
  name: {{ .Values.postgresExternalSecret.target.platformSecretName }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  externalSecretName: {{ .Values.postgresExternalSecret.target.platformSecretName }}
  refreshTime: 1m
  namespaceSelectors:
{{ toYaml .Values.postgresExternalSecret.target.platformNamespaceSelectors | indent 4 }}
  externalSecretSpec:
    refreshPolicy: Periodic
    refreshInterval: 24h
    secretStoreRef:
      name: parameterstore
      kind: ClusterSecretStore
    target:
      name: {{ .Values.postgresExternalSecret.target.platformSecretName }}
      creationPolicy: Owner
      template:
        engineVersion: v2
        data:
          username: {{ .Values.postgres.auth.username | quote }}
          password: '{{ printf "{{ index . %q }}" .Values.postgres.auth.secretKeys.userPasswordKey }}'
          database: {{ .Values.postgres.auth.database | quote }}
          host: {{ $serviceName | quote }}
          port: "5432"
    data:
      - secretKey: {{ .Values.postgres.auth.secretKeys.userPasswordKey }}
        remoteRef:
          key: {{ $remoteRefKey | quote }}
          property: {{ .Values.postgres.auth.secretKeys.userPasswordKey | quote }}
          conversionStrategy: Default
          decodingStrategy: None
          metadataPolicy: None
{{- end }}
