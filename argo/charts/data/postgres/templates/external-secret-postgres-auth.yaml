{{- $existingSecret := required "postgres.auth.existingSecret must be set" .Values.postgres.auth.existingSecret }}
{{- $remoteRefKey := .Values.postgresExternalSecret.remoteRef.key }}
{{- if $remoteRefKey }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $existingSecret }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  secretStoreRef:
    name: parameterstore
    kind: ClusterSecretStore
  refreshInterval: 24h
  target:
    name: {{ $existingSecret }}
    creationPolicy: Owner
  data:
    - secretKey: {{ .Values.postgres.auth.secretKeys.adminPasswordKey }}
      remoteRef:
        key: {{ $remoteRefKey | quote }}
        property: {{ .Values.postgres.auth.secretKeys.adminPasswordKey | quote }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    {{- if and .Values.postgres.auth.username (ne .Values.postgres.auth.username "postgres") }}
    - secretKey: {{ .Values.postgres.auth.secretKeys.userPasswordKey }}
      remoteRef:
        key: {{ $remoteRefKey | quote }}
        property: {{ .Values.postgres.auth.secretKeys.userPasswordKey | quote }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    {{- end }}
{{- end }}
