{{- if and .Values.airflow.enabled .Values.sparkIntegration.enabled }}
{{- range .Values.sparkIntegration.namespaces }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: airflow-spark-submit
  namespace: {{ . }}
rules:
  - apiGroups:
      - sparkoperator.k8s.io
    resources:
      - sparkapplications
      - sparkapplications/status
      - sparkapplications/finalizers
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - ""
    resources:
      - pods
      - services
      - configmaps
      - events
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: airflow-spark-submit
  namespace: {{ . }}
subjects:
{{- range $.Values.sparkIntegration.serviceAccountNames }}
  - kind: ServiceAccount
    name: {{ . }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: airflow-spark-submit
---
{{- end }}
{{- end }}
