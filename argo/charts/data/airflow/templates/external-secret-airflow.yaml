{{- if .Values.airflow.enabled }}
{{- $psKey := .Values.airflowExternalSecret.parameterStoreKey }}
{{- $pgPsKey := .Values.airflowExternalSecret.postgres.parameterStoreKey }}
{{- if and $psKey $pgPsKey }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: airflow-fernet
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  secretStoreRef:
    name: parameterstore
    kind: ClusterSecretStore
  refreshInterval: {{ .Values.airflowExternalSecret.refreshInterval }}
  target:
    name: airflow-fernet
    creationPolicy: Owner
  data:
    - secretKey: fernet-key
      remoteRef:
        key: {{ $psKey | quote }}
        property: fernet-key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: airflow-api
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  secretStoreRef:
    name: parameterstore
    kind: ClusterSecretStore
  refreshInterval: 24h
  target:
    name: airflow-api
    creationPolicy: Owner
  data:
    - secretKey: api-secret-key
      remoteRef:
        key: {{ $psKey | quote }}
        property: api-secret-key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: airflow-jwt
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  secretStoreRef:
    name: parameterstore
    kind: ClusterSecretStore
  refreshInterval: {{ .Values.airflowExternalSecret.refreshInterval }}
  target:
    name: airflow-jwt
    creationPolicy: Owner
  data:
    - secretKey: jwt-secret
      remoteRef:
        key: {{ $psKey | quote }}
        property: jwt-secret
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: airflow-webserver
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  secretStoreRef:
    name: parameterstore
    kind: ClusterSecretStore
  refreshInterval: {{ .Values.airflowExternalSecret.refreshInterval }}
  target:
    name: airflow-webserver
    creationPolicy: Owner
  data:
    - secretKey: webserver-secret-key
      remoteRef:
        key: {{ $psKey | quote }}
        property: webserver-secret-key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: airflow-git-ssh
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  secretStoreRef:
    name: parameterstore
    kind: ClusterSecretStore
  refreshInterval: {{ .Values.airflowExternalSecret.refreshInterval }}
  target:
    name: airflow-git-ssh
    creationPolicy: Owner
  data:
    - secretKey: gitSshKey
      remoteRef:
        key: {{ $psKey | quote }}
        property: git-sync-ssh-key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: airflow-metadata
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  secretStoreRef:
    name: parameterstore
    kind: ClusterSecretStore
  refreshInterval: {{ .Values.airflowExternalSecret.refreshInterval }}
  target:
    name: airflow-metadata
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        connection: 'postgresql+psycopg2://{{ .Values.airflowExternalSecret.postgres.user }}:{{ `{{ index . "platform-password" }}` }}@{{ .Values.airflowExternalSecret.postgres.host }}:{{ .Values.airflowExternalSecret.postgres.port }}/{{ .Values.airflowExternalSecret.postgres.database }}'
  data:
    - secretKey: platform-password
      remoteRef:
        key: {{ $pgPsKey | quote }}
        property: platform-password
{{- end }}
{{- end }}
