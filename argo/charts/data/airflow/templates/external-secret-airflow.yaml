{{- if .Values.airflow.enabled }}
{{- $psKey := .Values.airflowExternalSecret.parameterStoreKey }}
{{- $pgPsKey := .Values.airflowExternalSecret.postgres.parameterStoreKey }}
{{- if and $psKey $pgPsKey }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: airflow-fernet
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  secretStoreRef:
    name: parameterstore
    kind: ClusterSecretStore
  refreshInterval: {{ .Values.airflowExternalSecret.refreshInterval }}
  target:
    name: airflow-fernet
    creationPolicy: Owner
  data:
    - secretKey: fernet-key
      remoteRef:
        key: {{ $psKey | quote }}
        property: fernet-key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: airflow-api
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  secretStoreRef:
    name: parameterstore
    kind: ClusterSecretStore
  refreshInterval: 24h
  target:
    name: airflow-api
    creationPolicy: Owner
  data:
    - secretKey: api-secret-key
      remoteRef:
        key: {{ $psKey | quote }}
        property: api-secret-key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: airflow-jwt
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  secretStoreRef:
    name: parameterstore
    kind: ClusterSecretStore
  refreshInterval: {{ .Values.airflowExternalSecret.refreshInterval }}
  target:
    name: airflow-jwt
    creationPolicy: Owner
  data:
    - secretKey: jwt-secret
      remoteRef:
        key: {{ $psKey | quote }}
        property: jwt-secret
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: airflow-webserver
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  secretStoreRef:
    name: parameterstore
    kind: ClusterSecretStore
  refreshInterval: {{ .Values.airflowExternalSecret.refreshInterval }}
  target:
    name: airflow-webserver
    creationPolicy: Owner
  data:
    - secretKey: webserver-secret-key
      remoteRef:
        key: {{ $psKey | quote }}
        property: webserver-secret-key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: airflow-git-ssh
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  secretStoreRef:
    name: parameterstore
    kind: ClusterSecretStore
  refreshInterval: {{ .Values.airflowExternalSecret.refreshInterval }}
  target:
    name: airflow-git-ssh
    creationPolicy: Owner
  data:
    - secretKey: gitSshKey
      remoteRef:
        key: {{ $psKey | quote }}
        property: git-sync-ssh-key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: airflow-metadata
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  secretStoreRef:
    name: parameterstore
    kind: ClusterSecretStore
  refreshInterval: {{ .Values.airflowExternalSecret.refreshInterval }}
  target:
    name: airflow-metadata
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        {{- if .Values.airflow.pgbouncer.enabled }}
        connection: 'postgresql+psycopg2://{{ .Values.airflowExternalSecret.postgres.user }}:{{ `{{ index . "platform-password" }}` }}@{{ .Release.Name }}-pgbouncer.{{ .Release.Namespace }}.svc.cluster.local:6543/{{ .Release.Name }}-metadata'
        {{- else }}
        connection: 'postgresql+psycopg2://{{ .Values.airflowExternalSecret.postgres.user }}:{{ `{{ index . "platform-password" }}` }}@{{ .Values.airflowExternalSecret.postgres.host }}:{{ .Values.airflowExternalSecret.postgres.port }}/{{ .Values.airflowExternalSecret.postgres.database }}'
        {{- end }}
  data:
    - secretKey: platform-password
      remoteRef:
        key: {{ $pgPsKey | quote }}
        property: platform-password
{{- if .Values.airflow.pgbouncer.enabled }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: airflow-pgbouncer-config
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  secretStoreRef:
    name: parameterstore
    kind: ClusterSecretStore
  refreshInterval: {{ .Values.airflowExternalSecret.refreshInterval }}
  target:
    name: airflow-pgbouncer-config
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        pgbouncer.ini: |
          [databases]
          {{ .Release.Name }}-metadata = host={{ .Values.airflowExternalSecret.postgres.host }} dbname={{ .Values.airflowExternalSecret.postgres.database }} port={{ .Values.airflowExternalSecret.postgres.port }} pool_size={{ .Values.airflow.pgbouncer.metadataPoolSize }}
          {{ .Release.Name }}-result-backend = host={{ .Values.airflowExternalSecret.postgres.host }} dbname={{ .Values.airflowExternalSecret.postgres.database }} port={{ .Values.airflowExternalSecret.postgres.port }} pool_size={{ .Values.airflow.pgbouncer.resultBackendPoolSize }}

          [pgbouncer]
          pool_mode = transaction
          listen_port = 6543
          listen_addr = *
          auth_type = scram-sha-256
          auth_file = /etc/pgbouncer/users.txt
          stats_users = {{ .Values.airflowExternalSecret.postgres.user }}
          ignore_startup_parameters = extra_float_digits
          max_client_conn = {{ .Values.airflow.pgbouncer.maxClientConn }}
          server_tls_sslmode = prefer
          server_tls_ciphers = normal
        users.txt: |
          "{{ .Values.airflowExternalSecret.postgres.user }}" "{{ `{{ index . "platform-password" }}` }}"
  data:
    - secretKey: platform-password
      remoteRef:
        key: {{ $pgPsKey | quote }}
        property: platform-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: airflow-pgbouncer-stats
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  secretStoreRef:
    name: parameterstore
    kind: ClusterSecretStore
  refreshInterval: {{ .Values.airflowExternalSecret.refreshInterval }}
  target:
    name: airflow-pgbouncer-stats
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        connection: 'postgresql://{{ .Values.airflowExternalSecret.postgres.user }}:{{ `{{ index . "platform-password" }}` }}@127.0.0.1:6543/pgbouncer?sslmode=disable'
  data:
    - secretKey: platform-password
      remoteRef:
        key: {{ $pgPsKey | quote }}
        property: platform-password
{{- end }}
{{- if .Values.airflow.remoteLogging.enabled }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: airflow-remote-logging-env
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  secretStoreRef:
    name: parameterstore
    kind: ClusterSecretStore
  refreshInterval: {{ .Values.airflowExternalSecret.refreshInterval }}
  target:
    name: airflow-remote-logging-env
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        AWS_REGION: '{{ `{{ index . "aws-region" }}` }}'
        AWS_DEFAULT_REGION: '{{ `{{ index . "aws-region" }}` }}'
        AIRFLOW_CONN_AWS_DEFAULT: 'aws://?region_name={{ `{{ index . "aws-region" }}` }}'
        AIRFLOW__LOGGING__REMOTE_LOGGING: "True"
        AIRFLOW__LOGGING__REMOTE_BASE_LOG_FOLDER: 's3://{{ `{{ index . "remote-log-bucket" }}` }}/{{ `{{ index . "remote-log-prefix" }}` }}'
        AIRFLOW__LOGGING__REMOTE_LOG_CONN_ID: aws_default
        AIRFLOW__LOGGING__ENCRYPT_S3_LOGS: "False"
        AIRFLOW__LOGGING__DELETE_LOCAL_LOGS: "True"
  data:
    - secretKey: aws-region
      remoteRef:
        key: {{ $psKey | quote }}
        property: aws-region
    - secretKey: remote-log-bucket
      remoteRef:
        key: {{ $psKey | quote }}
        property: remote-log-bucket
    - secretKey: remote-log-prefix
      remoteRef:
        key: {{ $psKey | quote }}
        property: remote-log-prefix
{{- end }}
{{- end }}
{{- end }}
