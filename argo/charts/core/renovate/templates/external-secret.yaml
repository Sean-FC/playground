{{- if and .Values.renovate.enabled .Values.renovate.renovate.existingSecret .Values.auth.externalSecret.remoteRef.key }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.renovate.renovate.existingSecret }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  secretStoreRef:
    name: parameterstore
    kind: ClusterSecretStore
  refreshInterval: 24h
  target:
    name: {{ .Values.renovate.renovate.existingSecret }}
    creationPolicy: Owner
  data:
    - secretKey: mendRnvGithubAppId
      remoteRef:
        key: {{ .Values.auth.externalSecret.remoteRef.key | quote }}
        property: {{ .Values.auth.externalSecret.remoteRef.githubAppIdProperty | quote }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: mendRnvGithubAppKey
      remoteRef:
        key: {{ .Values.auth.externalSecret.remoteRef.key | quote }}
        property: {{ .Values.auth.externalSecret.remoteRef.githubAppKeyProperty | quote }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: mendRnvLicenseKey
      remoteRef:
        key: {{ .Values.auth.externalSecret.remoteRef.key | quote }}
        property: {{ .Values.auth.externalSecret.remoteRef.licenseKeyProperty | quote }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
{{- end }}
